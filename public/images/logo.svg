<svg xmlns="http://www.w3.org/2000/svg" viewBox="30 20 240 260">

  <defs>
    <!-- Shield shape for clipping -->
    <clipPath id="shieldClip">
      <path d="M150 20                 L270 80                 L240 220                 Q150 290 60 220                 L30 80 Z"/>
    </clipPath>
  </defs>

  <!-- Shield background -->
  <path d="M150 20             L270 80             L240 220             Q150 290 60 220             L30 80 Z" fill="#0B2A59"/>

  <!-- Group clipped inside shield -->
  <g clip-path="url(#shieldClip)">

    <!-- Explosion effect -->
    <polygon points="150,20 165,90 230,60 190,120 270,150 190,180 230,240 165,210 150,280 135,210 70,240 110,180 30,150 110,120 70,60 135,90" fill="#1E90FF" opacity="0.35"/>

    <!-- Bat -->
    <rect x="138" y="60" width="24" height="170" rx="12" fill="#F4A300" transform="rotate(-30 150 150)"/>

    <!-- Ball -->
    <circle cx="200" cy="95" r="35" fill="white" stroke="#F4A300" stroke-width="6"/>

    <!-- Ball seams -->
    <path d="M175 75 Q200 95 225 115" stroke="#F4A300" stroke-width="4" fill="none"/>

    <path d="M225 75 Q200 95 175 115" stroke="#F4A300" stroke-width="4" fill="none"/>

    <!-- Motion streak -->
    <path d="M120 170 Q150 130 200 110" stroke="white" stroke-width="6" fill="none" opacity="0.6"/>

  </g>

</svg>